<div class="eyebrow">문의</div>
<h1>Bundle 팀에 문의하세요.</h1>
<p class="lead">질문, 의견, 안전 관련 우려 또는 언론 문의를 보내 주세요. 영업일 기준 2일 이내에 답변드려요.</p>
<div class="card">
<form id="f" novalidate data-mail="이메일 쓰기" data-ok="감사합니다. 메시지가 전송되었고, 이메일로 답변드릴게요.">
  <label for="name">이름<input id="name" name="name" autocomplete="name" required></label>
  <label for="email">이메일<input id="email" name="email" type="email" autocomplete="email" required></label>
  <label for="topic">주제<select id="topic" name="topic"><option>일반 문의</option><option>계정 또는 로그인</option><option>안전 또는 사용자 신고</option><option>의견 또는 아이디어</option><option>언론 또는 제휴</option></select></label>
  <label for="message">메시지<textarea id="message" name="message" required minlength="10"></textarea></label>
  <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
  <div><button class="btn" type="submit"><span class="spin" aria-hidden="true"></span>메시지 보내기</button></div>
  <p class="status" role="status" aria-live="polite"></p>
</form>
</div>
<p class="muted" style="margin-top:24px">이메일이 더 편하신가요? 여기로 보내 주세요: <a href="mailto:support@meetbundle.com">support@meetbundle.com</a></p>
<p class="muted">누군가를 신고하려면 앱에서 그 사람의 프로필이나 대화에 있는 Report를 이용할 수도 있어요.</p>
