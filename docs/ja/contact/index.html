<div class="eyebrow">お問い合わせ</div>
<h1>Bundle チームに連絡する。</h1>
<p class="lead">ご質問、ご意見、安全に関するご相談、取材のご依頼をお待ちしています。2 営業日以内にご返信します。</p>
<div class="card">
<form id="f" novalidate data-mail="メールを書く" data-ok="ありがとうございます。メッセージを送信しました。メールでご返信します。">
  <label for="name">お名前<input id="name" name="name" autocomplete="name" required></label>
  <label for="email">メールアドレス<input id="email" name="email" type="email" autocomplete="email" required></label>
  <label for="topic">件名<select id="topic" name="topic"><option>一般的なご質問</option><option>アカウントやログイン</option><option>安全・ユーザーの通報</option><option>ご意見・アイデア</option><option>取材・提携</option></select></label>
  <label for="message">メッセージ<textarea id="message" name="message" required minlength="10"></textarea></label>
  <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
  <div><button class="btn" type="submit"><span class="spin" aria-hidden="true"></span>メッセージを送信</button></div>
  <p class="status" role="status" aria-live="polite"></p>
</form>
</div>
<p class="muted" style="margin-top:24px">メールのほうが便利ですか？こちらへどうぞ： <a href="mailto:support@meetbundle.com">support@meetbundle.com</a></p>
