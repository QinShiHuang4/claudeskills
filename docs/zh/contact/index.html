<div class="eyebrow">联系</div>
<h1>与 Bundle 团队联系。</h1>
<p class="lead">问题、反馈、安全疑虑或媒体请求。我们会在 2 个工作日内回复。</p>
<div class="card">
<form id="f" novalidate data-mail="写邮件" data-ok="谢谢。你的消息已发出，我们会通过邮件回复。">

  <label for="email">电子邮件<input id="email" name="email" type="email" autocomplete="email" required></label>

  <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
  <div><button class="btn" type="submit"><span class="spin" aria-hidden="true"></span>发送消息</button></div>
  <p class="status" role="status" aria-live="polite"></p>
</form>
</div>
<p class="muted" style="margin-top:24px">更喜欢邮件？写信给我们： <a href="mailto:support@meetbundle.com">support@meetbundle.com</a></p>
