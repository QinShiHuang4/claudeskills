<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Meet Bundle video scene (Thai)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --blue:#2f6bff; --blue-d:#1f4fd6; --red:#e2405a; --ink:#15171c; --muted:#6b7280;
  --th:"Noto Sans Thai","Roboto",sans-serif;
  --app:"Roboto","Noto Sans Thai",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;perspective:2600px;font-family:var(--th);color:#fff}
.abs{position:absolute;left:0;top:0}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:middle;fill:currentColor}

/* ---------- headline text ---------- */
.title{position:absolute;left:0;top:0;transform-origin:0 0;font-weight:800;letter-spacing:-.01em;line-height:1.24;white-space:nowrap}
.title .ln{display:block}
.w{display:inline-block;will-change:transform,filter,opacity}
.blue{color:#3d7bff}
.cap{position:absolute;white-space:nowrap;font-weight:400;color:#fff}
.cap b{font-weight:700}
.cap span.dim{color:rgba(255,255,255,.82)}

/* ---------- lockup ---------- */
.lockup{position:absolute;left:0;top:0;display:flex;align-items:center;transform-origin:0 0;white-space:nowrap}
.lockup img{display:block}
.lockup .wm{font-family:"Roboto",sans-serif;font-weight:700;letter-spacing:-.015em;color:#fff}
.lockup .wm span{display:inline-block}

/* ---------- store badges ---------- */
.badges{position:absolute;display:flex;gap:14px;transform-origin:0 0}
.badge{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:12px;padding:0 18px 0 14px;height:62px}
.badge svg{width:30px;height:30px}
.badge small{display:block;font:500 13px/1.1 var(--th);letter-spacing:0}
.badge b{display:block;font:700 22px/1.1 "Roboto",sans-serif;letter-spacing:-.01em}

/* ---------- phone ---------- */
.phone{position:absolute;left:0;top:0;width:414px;height:868px;transform-style:preserve-3d;transform-origin:50% 50%}
.face{position:absolute;inset:0;border-radius:58px;backface-visibility:hidden}
.front{background:#11141b;padding:11px;transform:translateZ(7px);box-shadow:inset 0 0 0 2px #2a3040,inset 0 0 0 4px #0c0e13}
.back{transform:rotateY(180deg) translateZ(7px);background:linear-gradient(135deg,#1b2130,#0d1017 55%,#1a2030);box-shadow:inset 0 0 0 2px #2a3040}
.back .cam{position:absolute;left:34px;top:34px;width:120px;height:120px;border-radius:34px;background:#0a0c11;box-shadow:inset 0 0 0 2px #262c3a}
.edge{position:absolute;top:56px;height:756px;width:14px;background:linear-gradient(90deg,#20263a,#3a4258 50%,#20263a)}
.edge.l{left:0;transform-origin:0 50%;transform:translateZ(7px) rotateY(90deg)}
.edge.r{right:0;transform-origin:100% 50%;transform:translateZ(7px) rotateY(-90deg)}
.screen{position:relative;width:392px;height:846px;border-radius:47px;overflow:hidden;background:#fff;font-family:var(--app);color:var(--ink)}
.gloss{position:absolute;inset:0;border-radius:47px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.0) 40%,rgba(255,255,255,.10) 48%,rgba(255,255,255,0) 58%)}
.glow{position:absolute;left:0;top:0;width:520px;height:70px;border-radius:50%;background:radial-gradient(closest-side,rgba(47,107,255,.55),rgba(47,107,255,0));filter:blur(10px);transform-origin:50% 50%}

/* ---------- app chrome ---------- */
.scr{position:absolute;inset:0;background:#fff;overflow:hidden}
.sb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 34px;font:500 15px "Roboto";z-index:5}
.sb .hole{position:absolute;left:50%;top:13px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0c10}
.sb .ic{display:flex;gap:6px;align-items:center}
.sig{display:flex;align-items:flex-end;gap:2px;height:12px}.sig i{display:block;width:3px;background:#111;border-radius:1px}
.bat{width:24px;height:12px;border-radius:3px;background:#2ecc5a}
.hdr{position:absolute;left:0;right:0;top:44px;height:56px;display:flex;align-items:center;justify-content:center;z-index:5;background:#fff}
.hdr .l{position:absolute;left:22px;font-size:22px;color:#222;display:flex}
.hdr .r{position:absolute;right:20px;display:flex;gap:16px;font-size:22px;color:#222}
.alogo{display:flex;align-items:center;gap:5px;color:#2f6bff;font:700 22px "Roboto";letter-spacing:-.02em}
.alogo img{width:28px;height:auto}
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #eef0f4;display:flex;justify-content:space-around;padding-top:10px;z-index:6}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11.5px var(--th);color:#6b7280;width:80px}
.nav div svg{width:24px;height:24px}
.nav div.on{color:#2f6bff;font-weight:700}
.navbar{position:absolute;left:50%;bottom:6px;width:120px;height:4px;margin-left:-60px;border-radius:2px;background:#cfd3da;z-index:7}

/* discover */
.feed{position:absolute;left:0;right:0;top:100px;bottom:78px;overflow:hidden}
.feedin{position:absolute;left:0;right:0;top:0}
.card{position:relative;margin:0 12px 14px;height:560px;border-radius:24px;overflow:hidden;background:#ccc}
.card .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.card .ph svg{width:100%;height:100%;display:block}
.card .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 62%,rgba(0,0,0,.5) 100%)}
.prog{position:absolute;left:14px;right:14px;top:10px;display:flex;gap:6px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.prog i.on{background:#fff}
.nm{position:absolute;left:16px;top:24px;color:#fff;font:600 27px var(--app);display:flex;align-items:center;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.nm svg{width:22px;height:22px}
.loc{position:absolute;left:16px;top:64px;color:rgba(255,255,255,.95);font:400 13.5px var(--app);display:flex;align-items:center;gap:5px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.loc svg{width:14px;height:14px}
.cnt{position:absolute;right:14px;top:24px;background:rgba(0,0,0,.35);color:#fff;font:500 13px "Roboto";padding:4px 10px;border-radius:12px}
.vp{position:absolute;left:16px;bottom:96px;color:#fff;font:500 14.5px var(--app)}
.pill{position:absolute;left:14px;bottom:50px;color:#fff;font:500 13.5px var(--app);border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.18);border-radius:20px;padding:7px 14px;display:flex;align-items:center;gap:6px}
.pill svg{width:13px;height:13px}
.wink{position:absolute;right:14px;bottom:60px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font:500 12px "Roboto"}
.wink .b{width:46px;height:46px;border-radius:50%;background:#fff;color:#2f6bff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.wink .b svg{width:28px;height:28px}
.acts{position:absolute;left:0;right:0;bottom:84px;height:104px;z-index:4;display:flex;justify-content:center;align-items:flex-end;gap:34px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px "Roboto";color:#6b7280}
.act .b{display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.act.pass .b{width:62px;height:62px;border-radius:50%;background:#fff;color:#2f6bff}.act.pass .b svg{width:28px;height:28px}
.act.spark .b{width:72px;height:72px;border-radius:20px;background:linear-gradient(180deg,#fff,#e7efff);box-shadow:0 4px 14px rgba(47,107,255,.35),inset 0 0 0 1.5px #cfdcff}
.act.spark .b img{width:46px;height:46px}
.act.spark{color:#2f6bff}
.act.like .b{width:78px;height:78px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 0 0 5px #fff,0 6px 16px rgba(0,0,0,.25)}.act.like .b svg{width:34px;height:34px}
.act.like{color:var(--red)}
.ring{position:absolute;border-radius:50%;border:3px solid #6f9bff;pointer-events:none}

/* spark sent card */
.sparkcard{position:absolute;left:24px;right:24px;top:296px;background:#fff;border-radius:16px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:3;font-family:var(--app)}
.sparkcard .k{display:flex;align-items:center;gap:6px;color:#2f6bff;font:700 12px var(--app);letter-spacing:.03em}
.sparkcard .k img{width:18px}
.sparkcard .q{margin-top:6px;color:#1f3fae;font:500 16px/1.45 var(--app)}
.sparkcard .s{margin-top:6px;color:#6b7280;font:400 12.5px var(--app)}
.notif{position:absolute;left:12px;right:12px;top:52px;height:70px;background:#fff;border-radius:18px;box-shadow:0 8px 26px rgba(0,0,0,.22);z-index:8;display:flex;align-items:center;gap:12px;padding:0 16px}
.notif img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.notif b{display:block;font:600 15.5px var(--app)}
.notif small{display:block;font:400 13px var(--app);color:#6b7280;margin-top:2px}
.notif svg{margin-left:auto;width:26px;height:26px;color:var(--red)}

/* match */
.match{background:radial-gradient(120% 70% at 50% 45%,#ffffff 0,#eef3ff 60%,#e4ecff 100%)}
.pair{position:absolute;left:50%;top:300px;width:250px;height:130px;margin-left:-125px}
.av{position:absolute;top:0;width:128px;height:128px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 20px rgba(47,107,255,.25);overflow:hidden;background:#ddd}
.av img{width:100%;height:100%;object-fit:cover}
.pair .a1{left:0}.pair .a2{right:0}
.pair .mk{position:absolute;left:50%;top:76px;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(47,107,255,.3)}
.pair .mk img{width:38px}
.mt{position:absolute;left:0;right:0;top:468px;text-align:center;font:700 34px var(--th);color:#15171c}
.ms{position:absolute;left:0;right:0;top:526px;text-align:center;font:400 15.5px var(--th);color:#5b6270}
.say{position:absolute;left:40px;right:40px;top:586px;height:54px;border-radius:27px;background:#2f6bff;color:#fff;display:grid;place-items:center;font:600 17px var(--th);box-shadow:0 8px 20px rgba(47,107,255,.35)}
.keep{position:absolute;left:0;right:0;top:660px;text-align:center;font:500 15px var(--th);color:#5b6270}
.ht{position:absolute;width:18px;height:18px}

/* spark composer */
.sheetdim{position:absolute;inset:0;background:rgba(10,14,25,.45);z-index:9;opacity:0}
.sheet{position:absolute;left:0;right:0;bottom:0;height:372px;background:#fff;border-radius:28px 28px 0 0;z-index:10;padding:12px 20px 0;transform:translateY(400px);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#d6d9e0;margin:0 auto 16px}
.sh1{display:flex;align-items:center;gap:12px}
.sh1 img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.sh1 b{display:block;font:700 19px var(--th);color:#15171c}
.sh1 small{display:block;font:400 13px var(--th);color:#6b7280;margin-top:2px}
.field{margin-top:16px;height:132px;border-radius:18px;background:#f3f6ff;box-shadow:inset 0 0 0 2px #cfdcff;padding:14px 16px;font:500 17px/1.5 var(--th);color:#1f3fae}
.caret{display:inline-block;width:2px;height:20px;background:#2f6bff;vertical-align:-3px;margin-left:1px}
.sendb{margin-top:16px;height:56px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font:600 17px var(--th);box-shadow:0 8px 20px rgba(47,107,255,.35)}
.sendb .st{width:20px;height:20px;display:inline-flex}.sendb .st svg{width:100%;height:100%}
.spk{position:absolute;left:0;top:0;width:28px;height:28px;color:#7fb0ff;pointer-events:none}
/* pattaya: home screen + toasts */
.home{position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 10%,#3a4a8c 0,#1a2147 55%,#0d1126 100%);color:#fff}
.home .clk{position:absolute;left:0;right:0;top:92px;text-align:center;font:300 76px/1 "Roboto";letter-spacing:-.02em}
.home .dt{position:absolute;left:0;right:0;top:176px;text-align:center;font:500 16px var(--th);opacity:.85}
.apps{position:absolute;left:26px;right:26px;top:300px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11.5px var(--th);color:rgba(255,255,255,.9)}
.app i{display:block;width:60px;height:60px;border-radius:16px}
.app img{width:60px;height:60px;border-radius:16px;display:block}
.tapr{position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
.toast{position:absolute;left:12px;right:12px;height:74px;background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:8;display:flex;align-items:center;gap:12px;padding:0 14px;opacity:0}
.toast img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.toast b{display:block;font:600 15px var(--th);color:#15171c}
.toast small{display:block;font:400 13px var(--th);color:#5b6270;margin-top:2px;white-space:nowrap}
.endbg{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 45%,#121a2c 0,#080b13 70%,#05070c 100%);opacity:0}
/* wink */
.wfeat{position:absolute;left:14px;right:14px;top:170px;height:430px;border-radius:24px;overflow:hidden;background:#dfe6f5}
.wfeat .ph{position:absolute;inset:0}
.wfeat .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
.wfeat .ring2{position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 3px #3d7bff;pointer-events:none}
.wfeat .n{position:absolute;left:18px;bottom:62px;color:#fff;font:600 26px var(--app)}
.wfeat .c{position:absolute;left:18px;bottom:36px;color:rgba(255,255,255,.92);font:400 14px var(--th)}
.wfeat .chip{left:14px;top:14px;opacity:0}
.wfeat .lb2{position:absolute;right:16px;bottom:22px;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 6px 16px rgba(0,0,0,.3)}
.wfeat .lb2 svg{width:30px;height:30px}
.wrow{position:absolute;left:14px;right:14px;top:616px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wrow>div{height:140px;border-radius:18px;overflow:hidden;position:relative}
.wrow .more{background:linear-gradient(160deg,#4d8bff,#2453d6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 34px "Outfit"}
.wrow .more small{font:500 13px var(--th);opacity:.9}
.wbub{position:absolute;left:50%;top:385px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fa0ff,#2f6bff 60%,#1f4fd6);color:#fff;display:grid;place-items:center;box-shadow:0 0 40px rgba(61,123,255,.9);z-index:9;opacity:0}
.wbub svg{width:92px;height:92px}
.wrng{position:absolute;left:50%;top:385px;border-radius:50%;border:4px solid #6f9bff;z-index:8;opacity:0}
.hburst{position:absolute;z-index:9;color:var(--red);opacity:0}
/* wink2: full-screen recreation of the real app's Wink flow (392x697 css, scaled to 1080x1920) */
.w2app{position:absolute;left:0;top:0;width:392px;height:697px;transform-origin:0 0;overflow:hidden;background:#fff;font-family:var(--app);color:#15171c}
.w2l{position:absolute;inset:0;background:#fff;opacity:0;isolation:isolate}
.w2sb{position:absolute;left:0;right:0;top:0;height:42px;font:500 15px "Roboto";color:#111}
.w2sb .tm{position:absolute;left:22px;top:12px}
.w2sb .hole{position:absolute;left:50%;top:10px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0c10}
.w2sb .ic{position:absolute;right:22px;top:14px;display:flex;gap:6px;align-items:center}
.w2hd{position:absolute;left:0;right:0;top:56px;height:34px}
.w2hd .l{position:absolute;left:14px;top:5px;font-size:24px;display:flex;color:#222}
.w2hd .r{position:absolute;right:14px;top:5px;display:flex;gap:18px;font-size:24px;color:#222}
.w2logo{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;align-items:center;gap:4px;color:#2f6bff;font:700 26px "Roboto";letter-spacing:-.02em}
.w2logo img{width:34px}
.w2card{position:absolute;left:11px;width:370px;top:110px;height:414px;border-radius:22px;overflow:hidden;background:#ccc}
.w2card .ph{position:absolute;inset:0}
.w2card .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 62%,rgba(0,0,0,.45) 100%)}
.w2card.wk{box-shadow:0 0 0 3px #4d7cff,0 0 18px rgba(77,124,255,.55)}
.w2card .prog{left:14px;right:14px;top:10px}
.w2card .nm{position:absolute;left:14px;top:22px;color:#fff;font:600 27px var(--app);display:flex;align-items:center;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.w2card .nm svg{width:20px;height:20px}
.w2card .loc{position:absolute;left:14px;top:66px;color:#fff;font:400 14.5px var(--th);display:flex;gap:6px;align-items:center;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.w2card .loc svg{width:15px;height:15px}
.w2card .cnt{position:absolute;right:14px;top:24px;background:rgba(0,0,0,.35);color:#fff;font:500 13.5px "Roboto";padding:4px 10px;border-radius:13px}
.w2card .wchip{position:absolute;left:14px;top:93px;height:32px;padding:0 12px 0 9px;border-radius:16px;background:rgba(32,62,150,.78);box-shadow:inset 0 0 0 1px rgba(150,180,255,.6);color:#fff;font:500 14px var(--th);display:flex;align-items:center;gap:7px}
.w2card .wchip svg{width:19px;height:19px}
.w2card .vp{position:absolute;left:14px;top:300px;color:#fff;font:500 15.5px var(--th)}
.w2card .pill{position:absolute;left:8px;top:337px;color:#fff;font:400 14.5px var(--th);border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.15);border-radius:18px;padding:6px 14px;display:flex;align-items:center;gap:6px}
.w2card .pill svg{width:13px;height:13px}
.w2card .wk2{position:absolute;left:308px;top:320px;width:48px;height:48px;border-radius:50%;background:#fff;color:#2f6bff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.w2card .wk2 svg{width:30px;height:30px}
.w2card .wk2l{position:absolute;left:300px;width:64px;top:372px;text-align:center;color:#fff;font:400 12px var(--th)}
.w2acts{position:absolute;left:0;right:0;top:0;height:0;z-index:3}
.w2pass{position:absolute;left:57px;top:473px;width:62px;height:62px;border-radius:50%;background:#fff;color:#2f6bff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.w2pass svg{width:28px;height:28px}
.w2spark{position:absolute;left:151px;top:473px;width:78px;height:78px;border-radius:20px;background:linear-gradient(180deg,#fff,#e7efff);box-shadow:0 4px 14px rgba(47,107,255,.35),inset 0 0 0 1.5px #cfdcff;display:grid;place-items:center}
.w2spark img{width:50px}
.w2like{position:absolute;left:258px;top:469px;width:80px;height:80px;border-radius:50%;background:#e2405a;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 6px 16px rgba(0,0,0,.25)}
.w2like svg{width:34px;height:34px}
.w2lbl{position:absolute;font:400 13.5px var(--th);color:#6b7280;transform:translateX(-50%);white-space:nowrap}
.w2nav{position:absolute;left:0;right:0;top:590px;height:107px;border-top:1px solid #eef0f4;background:#fff}
.w2nav .it{position:absolute;top:12px;width:90px;margin-left:-45px;display:flex;flex-direction:column;align-items:center;gap:4px;font:400 13px var(--th);color:#5b6270}
.w2nav .it svg{width:25px;height:25px}
.w2nav .it.on{color:#2f6bff;font-weight:600}
.w2nav .sys{position:absolute;top:80px;left:0;right:0;height:16px}
.w2nav .sys i{position:absolute;top:0;display:block;background:#3b3f47}

<body>
<div id="stage"></div>
<script>
// ---------------------------------------------------------------------------
// Query: ?comp=fd|intro&ar=169|916
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const COMP = Q.get('comp') || 'fd';
const AR = Q.get('ar') || '169';
const [W, H] = ({'169': [1920, 1080], '916': [1080, 1920], gp: [1080, 1920], as: [1290, 2796], fg: [1024, 500]})[AR];
const DUR = {fd: 15.5, intro: 9.6, spark: 15, pattaya: 7, wink: 7.5, wink2: 8.4, spark2: 4.6, sparkout: 3.4, free: 6.0, freeout: 4.4, ivout: 4.2, wedout: 5.4, store: 1}[COMP];
const LANG = Q.get('lang') || 'th'; // spark comp: th | en (fd and intro are Thai only)
const tr = (th, en) => LANG === 'en' ? en : th;
const VARIANT = Q.get('v') || 'b'; // fd feed order: a = Lina, Nami, Maya; b = Nami, Lina, Maya
window.DURATION = DUR; window.SIZE = [W, H];
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eback = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (t, a, b, e = eo) => e(clamp((t - a) / (b - a)));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const ic = (id, cls = 'i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;

// ---------- avatar pool (real photos, rotated across every screen) ----------
const PEOPLE = {
  maya:    {img: 'assets/maya-cafe.jpg', face: 'assets/maya-face.jpg', pos: '50% 28%'},
  lina:    {img: 'assets/lina.jpg', face: 'assets/lina-face.jpg', pos: '50% 22%'},
  nami:    {img: 'assets/nami.jpg', face: 'assets/nami-face.jpg', pos: '50% 34%'},
  shachar: {img: 'assets/shachar-face.jpg', face: 'assets/shachar-face.jpg', pos: '50% 40%'},
  her:     {img: 'assets/her-face.jpg', face: 'assets/her-face.jpg', pos: 'center'},
  omer:    {img: 'assets/omer-club.jpg', face: 'assets/omer-face.jpg', pos: '50% 30%'},
  omerR:   {img: 'assets/omer-real.jpg', face: 'assets/omer-real-face.jpg', pos: '58% 40%'},
  linaR:   {img: 'assets/lina.jpg', face: 'assets/lina-face.jpg', pos: '50% 22%'},
  shacharR:{img: 'assets/shachar-real.jpg', face: 'assets/shachar-real-face.jpg', pos: '47% 35%'},
};
const photo = (who, cover) => `<img src="${cover ? PEOPLE[who].img : PEOPLE[who].face}" style="width:100%;height:100%;object-fit:cover;object-position:${cover ? PEOPLE[who].pos : 'center'};display:block" alt="">`;

// ---------- app screens (Thai UI) ----------
const LOGO_APP = `<div class="alogo"><img src="assets/logo-192.png" alt="">Meet Bundle</div>`;
const statusBar = (tm) => `<div class="sb"><span>${tm}</span><div class="hole"></div><div class="ic"><div class="sig"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:12px;opacity:.3"></i></div><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 12 0 3.5C4.5-.8 11.5-.8 16 3.5Z" fill="#111"/></svg><div class="bat"></div></div></div>`;
const nav = (on) => `<div class="nav">${[['compass', tr('ค้นพบ', 'Discover')], ['heart-o', tr('ถูกใจคุณ', 'Likes')], ['chats', tr('แมตช์', 'Matches')], ['user', tr('โปรไฟล์', 'Profile')]].map(([i, l], k) => `<div class="${k === on ? 'on' : ''}">${ic(k === on ? (i === 'heart-o' ? 'heart' : i + '-f') : i)}${l}</div>`).join('')}</div><div class="navbar"></div>`;

function feedCard(p) {
  const ph = `<div class="ph">${photo(p.who, true)}</div>`;
  return `<div class="card">${ph}<div class="sh"></div>
  <div class="prog">${[0, 1, 2].map(i => `<i class="${i === (p.pg || 0) ? 'on' : ''}"></i>`).join('')}</div>
  <div class="nm">${p.name}${p.ver ? ic('verified') : ''}</div>
  <div class="loc">${ic('pin')}${p.loc}</div>
  <div class="cnt">${(p.pg || 0) + 1} / 3</div>
  <div class="vp">${tr('ดูโปรไฟล์', 'View profile')}</div>
  <div class="pill">${p.pct}% · ${tr('ความสนใจที่ตรงกัน', 'Shared interests')} ${ic('chev')}</div>
  <div class="wink"><div class="b">${ic('smile')}</div>Wink</div></div>`;
}
const MAYA = {name: 'Maya, 26', ver: 1, loc: 'เทลอาวีฟ อิสราเอล · ห่างไปประมาณ 3 กม.', pct: 60, who: 'maya'};
const LINA = {name: 'Lina, 25', loc: 'จาฟฟา · ห่างไปประมาณ 4 กม.', pct: 45, who: 'lina'};
const NAMI = {name: 'Nami, 24', loc: 'รามัตกัน · ห่างไปประมาณ 6 กม.', pct: 52, who: 'nami'};
function discover(id, cards, tm = '10:04', o = {}) {
  o = {to: 'MAYA', who: 'maya', quote: '“วิวหุบผานั่นสวยเกินจริงไปมาก ที่มิตซ์เป ราโมนใช่ไหม?”', ...o};
  return `<div class="scr" id="${id}">${statusBar(tm)}
  <div class="hdr"><div class="l">${ic('moon')}</div>${LOGO_APP}<div class="r">${ic('refresh')}${ic('tune')}</div></div>
  <div class="feed"><div class="feedin">${cards.map(feedCard).join('')}</div>
    <div class="sparkcard" style="opacity:0"><div class="k"><img src="assets/spark.png" alt="">${tr('SPARK ถึง ', 'SPARK TO ')}${o.to}</div>
      <div class="q">${o.quote}</div>
      <div class="s">${tr('ส่งแล้ว ✓ · Spark จะถูกอ่านก่อนเสมอ', 'Sent ✓ · Sparks get read first')}</div></div>
  </div>
  <div class="acts"><div class="act pass"><div class="b">${ic('x')}</div>Pass</div><div class="act spark"><div class="b"><img src="assets/spark.png" alt=""></div>Spark</div><div class="act like"><div class="b">${ic('heart')}</div>Like</div></div>
  <div class="notif" style="opacity:0"><img src="${PEOPLE[o.who].face}" alt=""><div><b>${o.name || 'Maya'} ${tr('กด Like กลับแล้ว', 'liked you back')}</b><small>${tr('Spark ของคุณได้ผล', 'Your Spark landed')}</small></div>${ic('heart')}</div>
  ${o.composer ? composer(o) : ''}
  ${nav(0)}</div>`;
}
function matchScreen(id, who = 'maya', name = 'Maya', me = 'shachar') {
  const hearts = [[60, 250, '#3d7bff'], [330, 270, '#e2405a'], [40, 420, '#3d7bff'], [345, 430, '#3d7bff'], [90, 520, '#e2405a'], [300, 560, '#3d7bff'], [180, 240, '#3d7bff'], [250, 470, '#e2405a']];
  return `<div class="scr match" id="${id}">
  ${hearts.map(([x, y, c]) => `<svg class="ht" style="left:${x}px;top:${y}px;color:${c}" viewBox="0 0 24 24"><use href="#heart" fill="${c}"/></svg>`).join('')}
  <div class="pair"><div class="av a1"><img src="${PEOPLE[me].face}" alt=""></div><div class="av a2"><img src="${PEOPLE[who].face}" alt=""></div><div class="mk"><img src="assets/logo-192.png" alt=""></div></div>
  <div class="mt">${tr('แมตช์แล้ว!', "It's a match!")}</div>
  <div class="ms">${tr(`คุณกับ ${name} ถูกใจกันและกัน`, `You and ${name} liked each other.`)}</div>
  <div class="say">${tr('ทักทายเลย', 'Say hello')}</div>
  <div class="keep">${tr('เลื่อนดูต่อ', 'Keep browsing')}</div></div>`;
}
function likesScreen(id) {
  const P = [['lina', 'Lina, 25', 'จาฟฟา'], ['shachar', 'Shachar, 31', 'รามัตกัน', 'w'], ['nami', 'Nami, 24', 'รามัตกัน', 'p'], ['maya', 'Maya, 26', 'เทลอาวีฟ']];
  return `<div class="scr" id="${id}">${statusBar('10:05')}
  <div class="hdr"><div class="l">${ic('moon')}</div>${LOGO_APP}<div class="r">${ic('refresh')}</div></div>
  <div class="pt">ถูกใจคุณ</div><div class="pc">14</div>
  <div class="grid">${P.map(([t, n, c, f]) => `<div class="lk ${f === 'w' ? 'w' : ''}"><div class="ph">${photo(t, true)}</div>
    ${f === 'w' ? `<div class="chip wk">${ic('smile')}ส่ง Wink ให้คุณ</div>` : ''}${f === 'p' ? `<div class="chip pt2">สัตว์เลี้ยง 🐾</div>` : ''}
    <div class="n">${n}</div><div class="c">${c}</div>
    <div class="ft"><div class="rm">${ic('x')}ลบ</div><div class="lb">${ic('heart')}Like</div></div></div>`).join('')}</div>
  ${nav(1)}</div>`;
}
function matchesScreen(id) {
  const R = [['maya', 'Maya', 'ทักทายเลย คุณแมตช์กันแล้ว!', 'เมื่อวาน'], ['shachar', 'Shachar', '✓✓ เจอกันวันอาทิตย์', '10 พ.ย.'], ['nami', 'Nami', 'ฮ่าๆ ตกลง 😄', '', 2], ['lina', 'Lina', 'ทักทายเลย คุณแมตช์กันแล้ว!', '4 พ.ย.']];
  return `<div class="scr" id="${id}">${statusBar('10:05')}
  <div class="hdr"><div class="l">${ic('moon')}</div>${LOGO_APP}</div>
  <div class="pt">แมตช์</div>
  <div class="srch">${ic('search')}ค้นหาแมตช์</div>
  <div class="rows">${R.map(([a, n, m, d, u]) => `<div class="row"><div class="ra">${photo(a)}</div><div><b>${n}</b><small>${m}</small></div>${d ? `<div class="dt">${d}</div>` : ''}${u ? `<div class="ub">${u}</div>` : ''}</div>`).join('')}</div>
  ${nav(2)}</div>`;
}
function chatScreen(id) {
  return `<div class="scr" id="${id}">${statusBar('10:12')}
  <div class="hdr"><div class="l">${ic('back')}</div>${LOGO_APP}</div>
  <div class="ch"><div class="ra">${photo('shachar')}</div><div><b>Shachar</b><small>ออนไลน์</small></div><div class="dots">${ic('dots')}</div></div>
  <div class="msgs">
    <div class="bb in">เฮ้! Spark ของคุณทำเราขำเลย</div>
    <div class="bb out">ฮ่า ดีใจที่ชอบนะ สัปดาห์นี้ไปกินกาแฟกันไหม?<span class="tk">✓✓</span></div>
    <div class="bb in">เช้าวันอาทิตย์ ริมทะเลดีไหม?</div>
    <div class="bb out">เจอกันวันอาทิตย์<span class="tk">✓✓</span></div>
  </div>
  <div class="cin">ข้อความ...</div><div class="snd">${ic('up')}</div>
  ${nav(2)}</div>`;
}

function composer(o) {
  return `<div class="sheetdim"></div><div class="sheet">
    <div class="grab"></div>
    <div class="sh1"><img src="${PEOPLE[o.who].face}" alt=""><div><b>${tr('ส่ง Spark ถึง ', 'Spark ')}${o.name}</b><small>${tr('Like พร้อมข้อความ ที่จะถูกอ่านก่อน', 'A Like with a message. It gets read first.')}</small></div></div>
    <div class="field"><span class="typed"></span><i class="caret"></i></div>
    <div class="sendb"><span class="st">${STAR}</span>${tr('ส่ง Spark', 'Send Spark')}</div></div>`;
}

// ---------- phone ----------
function makePhone(screensHtml) {
  const p = el(`<div class="phone"><div class="face back"><div class="cam"></div></div><div class="edge l"></div><div class="edge r"></div>
  <div class="face front"><div class="screen">${screensHtml}<div class="gloss"></div></div></div></div>`);
  return p;
}
function placePhone(p, cx, cy, s, rx, ry, rz, op = 1) {
  p.style.transform = `translate3d(${cx - 207}px,${cy - 434}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  p.style.opacity = op;
}

const STAR = `<svg viewBox="0 0 24 24"><path d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0Z" fill="currentColor"/></svg>`;

// ---------- text helpers ----------
function setWord(w, p, blur = 14, dy = 12) {
  w.style.opacity = p;
  w.style.filter = p >= 1 ? 'none' : `blur(${(1 - p) * blur}px)`;
  w.style.transform = `translateY(${(1 - p) * dy}px)`;
}
function badges() {
  return el(`<div class="badges"><div class="badge">${ic('apple')}<div><small>${tr('ดาวน์โหลดได้ที่', 'Download on the')}</small><b>App Store</b></div></div><div class="badge">${ic('play')}<div><small>${tr('ดาวน์โหลดได้ที่', 'Get it on')}</small><b>Google Play</b></div></div></div>`);
}
function lockup(px, glow) {
  const name = 'Meet Bundle';
  return el(`<div class="lockup"><img src="assets/logo-mark.png" style="width:${px * 1.35}px;margin-right:${px * .28}px;${glow ? `filter:drop-shadow(0 0 ${px * .35}px rgba(47,107,255,.75))` : ''}" alt=""><div class="wm" style="font-size:${px}px">${[...name].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</div></div>`);
}

// ===========================================================================
// COMPOSITION 1: "Free dating for everyone" (3D phone)
// ===========================================================================
function buildFD() {
  const L = AR === '169'
    ? {fs: 112, open: {s: 1.6, cy: 470}, side: {x: 150, y: 330, s: 1}, end: {s: 1.22, y: 318}, capFs: 30, phone: {x: 1344, y: 553, s: 1.0}, logoFs: 40, logoY: 236, badgeS: 1.15}
    : {fs: 100, open: {s: 1.35, cy: 900}, side: {cx: 1, y: 140, s: 1}, end: {s: 1.15, y: 700}, capFs: 34, phone: {x: 540, y: 1175, s: 1.2}, logoFs: 44, logoY: 612, badgeS: 1.25};
  window.L = L;
  const title = el(`<div class="title" style="font-size:${L.fs}px"><span class="ln"><span class="w">หาคู่</span><span class="w blue">ฟรี</span></span><span class="ln"><span class="w">สำหรับ</span><span class="w">ทุกคน</span></span></div>`);
  const caps = [
    ['<b>แค่เลื่อน</b> <span class="dim">ก็ได้เจอใครสักคน</span>', 2.85, 5.45],
    ['<b>ไม่ใช่แค่ Like</b> <span class="dim">แต่เป็น Spark</span>', 5.75, 8.85],
    ['<b>ชอบกันทั้งคู่</b> <span class="dim">แชตเปิดขึ้นทันที</span>', 9.05, 12.4],
  ].map(([h, a, b]) => { const c = el(`<div class="cap" style="font-size:${L.capFs}px">${h}</div>`); c._a = a; c._b = b; return c; });
  const glow = el(`<div class="glow"></div>`);
  const phone = makePhone(
    discover('sDisc', VARIANT === 'a' ? [LINA, NAMI, MAYA] : [NAMI, LINA, MAYA]) + matchScreen('sMatch'));
  const logo = lockup(L.logoFs, true);
  const bd = badges();
  [glow, phone, title, ...caps, logo, bd].forEach(e => stage.appendChild(e));
  const words = $$('.w', title);
  return {title, words, caps, phone, glow, logo, bd};
}

function renderFD(t, S) {
  const {title, words, caps, phone, glow, logo, bd} = S;
  const tw = title.offsetWidth, th = title.offsetHeight;
  // word reveal
  [0.12, 0.42, 0.72, 1.02].forEach((a, i) => setWord(words[i], prog(t, a, a + .45)));
  // title placement: open -> side (1.7..2.5) -> end (12.75..13.35)
  const ps = prog(t, 1.7, 2.55, eio), pe = prog(t, 12.7, 13.35, eio);
  const open = {s: L.open.s, x: (W - tw * L.open.s) / 2, y: L.open.cy - th * L.open.s / 2};
  const side = L.side.cx ? {s: L.side.s, x: (W - tw * L.side.s) / 2, y: L.side.y} : {s: L.side.s, x: L.side.x, y: L.side.y};
  const end = {s: L.end.s, x: (W - tw * L.end.s) / 2, y: L.end.y};
  let s = lerp(open.s, side.s, ps), x = lerp(open.x, side.x, ps), y = lerp(open.y, side.y, ps);
  s = lerp(s, end.s, pe); x = lerp(x, end.x, pe); y = lerp(y, end.y, pe);
  title.style.transform = `translate(${x}px,${y}px) scale(${s})`;
  // captions
  const capY = side.y + th * side.s + (AR === '169' ? 34 : 40);
  caps.forEach(c => {
    const pin = prog(t, c._a, c._a + .4), pout = prog(t, c._b, c._b + .35);
    const cw = c.offsetWidth;
    const cx = AR === '169' ? side.x : (W - cw) / 2;
    c.style.transform = `translate(${cx}px,${capY + (1 - pin) * 10}px)`;
    c.style.opacity = pin * (1 - pout);
    c.style.filter = pin < 1 ? `blur(${(1 - pin) * 8}px)` : pout > 0 ? `blur(${pout * 8}px)` : 'none';
  });
  // phone motion
  const P = L.phone;
  const pin = prog(t, 1.75, 2.75, eo);
  const pout = prog(t, 12.2, 13.0, p => p * p);
  const swing = t > 9.0 && t < 9.9 ? Math.sin(clamp((t - 9.0) / .9) * Math.PI * 2) * 34 * (1 - clamp((t - 9.0) / .9)) : 0;
  const sway = Math.sin(t * .9) * 4;
  let ry = lerp(-96, -14 + sway, pin) + swing + pout * 140;
  let rx = 6 + Math.sin(t * .7) * 1.5;
  let rz = lerp(-8, 2.5, pin) + Math.sin(t * .6) * .8;
  let cx = lerp(AR === '169' ? 1020 : 540, P.x, pin) + (AR === '169' ? pout * 60 : 0);
  let cy = P.y + lerp(AR === '169' ? 30 : 160, 0, pin) + Math.sin(t * 1.1) * 6;
  let sc = P.s * lerp(.9, 1, pin) * lerp(1, .72, pout);
  placePhone(phone, cx, cy, sc, rx, ry, rz, t < 1.75 ? 0 : clamp((t - 1.75) / .15) * (1 - prog(t, 12.6, 13.05, p => p)));
  glow.style.transform = `translate(${cx - 260}px,${cy + 434 * sc + 6}px) scale(${sc * .9},1)`;
  glow.style.opacity = (t < 1.75 ? 0 : pin) * (1 - pout) * .9;

  // --- screen content ---
  const feed = $('#sDisc .feedin', phone);
  const cardH = 574; // 560 + 14 gap
  // scroll: start partway into card 0, step to each next card
  const steps = [[3.25, 3.9], [4.45, 5.1]];
  let off = 0;
  steps.forEach(([a, b]) => { off += prog(t, a, b, eio) * cardH; });
  feed.style.transform = `translateY(${-off}px)`;
  // spark press 6.3..6.6
  const sparkBtn = $('#sDisc .act.spark .b', phone);
  const press = t > 6.25 && t < 6.75 ? Math.sin(clamp((t - 6.25) / .5) * Math.PI) : 0;
  sparkBtn.style.transform = `scale(${1 - press * .12})`;
  let ring = $('#sDisc .ring', phone);
  if (!ring) { ring = el('<div class="ring"></div>'); $('#sDisc', phone).appendChild(ring); }
  const rp = clamp((t - 6.35) / .6);
  const rr = 40 + rp * 70;
  ring.style.cssText += `;width:${rr * 2}px;height:${rr * 2}px;left:${196 - rr}px;bottom:${84 + 66 - rr + 6}px;opacity:${t > 6.35 && rp < 1 ? (1 - rp) : 0}`;
  const sc2 = $('#sDisc .sparkcard', phone);
  const sp = prog(t, 6.65, 7.15, eback);
  sc2.style.opacity = clamp((t - 6.65) / .25);
  sc2.style.transform = `translateY(${(1 - sp) * 40}px) scale(${lerp(.9, 1, sp)})`;
  const nt = $('#sDisc .notif', phone);
  const np = prog(t, 7.85, 8.3, eback), nout = prog(t, 9.0, 9.2);
  nt.style.opacity = clamp((t - 7.85) / .15) * (1 - nout);

function renderFree(t, S) {
  const {app} = S;
  // 0-2.5: paywall holds, the price sheet nudges up; 2.45: crack; 2.6: shatter
  const crack = $('.fcrack', app);
  crack.style.opacity = t > 2.4 && t < 2.75 ? 1 : 0;
  const sh = prog(t, 2.6, 3.4, p => p);
  $$('.fshard', app).forEach((d, i) => {
    const cx = +d.dataset.cx, cy = +d.dataset.cy;
    const dx = (cx - 50) / 50, dy = (cy - 80) / 80;
    const sp = 1 + (i % 5) * .25;
    d.style.transform = `translate(${dx * 260 * sh * sp}px,${(dy * 200 + 520 * sh) * sh * sp}px) rotate(${(i % 2 ? 1 : -1) * 110 * sh * sp}deg) scale(${1 - sh * .35})`;
    d.style.opacity = t < 2.6 ? 1 : 1 - prog(t, 2.9, 3.4);
    d.style.transformOrigin = `${cx}% ${cy}%`;
  });
  $('.sh2', app) && $$('.fshard .sh2', app).forEach(x => { x.style.transform = `translateY(${(1 - prog(t, .2, .7, eo)) * 120}px)`; });
  // Likes grid: tap Like on Omer at 4.0
  const L = $('#FL', app);
  const tq = clamp((t - 3.95) / .3);
  $('.w2tap', L).style.cssText += `;left:${10 + 8 + 128 - 28}px;top:${156 + 216 + 18 - 28}px;opacity:${t > 3.95 && tq < 1 ? (1 - tq) * .8 : 0};transform:scale(${.5 + tq * .6})`;
  // match
  const D = $('#FM', app);
  D.style.opacity = clamp((t - 4.4) / .2);
  const mp = prog(t, 4.45, 4.8, eo);
  $('.a1', D).style.transform = `translateX(${(1 - mp) * -160}px)`; $('.a2', D).style.transform = `translateX(${(1 - mp) * 160}px)`;
  $('.mk', D).style.transform = `scale(${prog(t, 4.7, 4.95, eback)})`;
  [['.t', 4.8], ['.s', 4.9], ['.b', 5.0], ['.k', 5.05]].forEach(([c, a]) => { const q = prog(t, a, a + .25); $(c, D).style.opacity = q; $(c, D).style.transform = `translateY(${(1 - q) * 12}px)`; });
  $$('.ht', D).forEach((h, i) => { const a = 4.65 + i * .06, q = clamp((t - a) / 1.3); h.style.opacity = t < a ? 0 : Math.sin(q * Math.PI) * .9; h.style.transform = `translateY(${-q * 50}px) scale(${.6 + q * .6})`; });
}
